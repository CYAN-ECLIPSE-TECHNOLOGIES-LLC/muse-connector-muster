name: tests

on:
  push:
  pull_request:

# The full matrix is kept on purpose. The connector and its suite are
# Python standard library only, so every cell is cheap, and the helper's
# whole point is portable path and process handling — exactly what a
# single-OS run would never catch. Nothing here needs trimming.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      # The Muster server package is not on PyPI yet (its Trusted
      # Publisher setup is pending), so the honest route today is
      # installing the server from its source checkout below. When the
      # package is live on PyPI, flip this to "pypi" and the install
      # step targets the published package instead. No other step
      # changes: the suite resolves the server the same way a user
      # does (the installed `eclipse-muster` entry point on PATH).
      SERVER_INSTALL_MODE: source
    steps:
      - name: Check out the connector
        uses: actions/checkout@v4

      - name: Check out the Muster server (server under test)
        if: env.SERVER_INSTALL_MODE == 'source'
        uses: actions/checkout@v4
        with:
          repository: CYAN-ECLIPSE-TECHNOLOGIES-LLC/eclipse-muster-mcp
          path: muster-server

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the Muster server from source
        if: env.SERVER_INSTALL_MODE == 'source'
        shell: bash
        run: python -m pip install ./muster-server

      - name: Install the Muster server from PyPI
        if: env.SERVER_INSTALL_MODE == 'pypi'
        shell: bash
        run: python -m pip install "eclipse-muster==0.1.0"

      # Nothing else is installed. The connector helper and the whole
      # test suite are standard library only (unittest, chosen over
      # pytest to keep the dependency count at zero).
      - name: Run the test suite
        shell: bash
        run: python -m unittest discover -s tests -v
